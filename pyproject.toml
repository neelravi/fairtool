[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "fairtool"
version = "1.0.0"
authors = [
  { name="Ravindra Shinde", email="r.l.shinde@utwente.nl" },
]
description = "A CLI tool for FAIR processing of computational materials science data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11, <3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "lxml>=5.1.1",	# Lexical XML
    "numpy>=1.22",	# The Great Python library
    "msgpack>=0.6.2",	# Binary Serialization in python
    "nomad-lab>=1.2.1", # Backend for parsing output files
    "nomad-parser-plugins-electronic>=1.1.0", # VASP and other parsers used by `nomad parse` (legacy `run` schema)
    "pymatgen>=2026.9.24", # Structures and symmetry analysis (requires Python 3.11+)
    "pint>=0.23",       # Unit conversion
    "pandas>=2.0",      # Tabular (CSV) export
    "pyyaml>=6.0",      # YAML config and export
    "rich>=13.8.0",     # Console output and logging
    "typer>=0.20.0",    # CLI framework with rich support
    "mkdocs-material",  # Running the visualization on the localhost
    "mkdocs-macros-plugin", # Macros used by the packaged mkdocs.yml
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairtool*"]

# mkdocs site template used by `fair visualize` (config, macros, theme overrides, hooks, static assets)
[tool.setuptools.package-data]
fairtool = ["site_template/**/*"]

[tool.setuptools.exclude-package-data]
fairtool = ["*.pyc"]

[project.urls]
"Homepage" = "https://github.com/neelravi/fairtool"
"Bug Tracker" = "https://github.com/neelravi/fairtool/issues"

# This makes the `fair` command available after installation
[project.scripts]
fair = "fairtool.cli:app"

[tool.coverage.run]
source = ["fairtool"]
branch = true
omit = [
    "fairtool/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
# The site template holds mkdocs data (macros, vendored Material for MkDocs hooks), not fairtool code
extend-exclude = ["fairtool/site_template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W291", "W293"]
